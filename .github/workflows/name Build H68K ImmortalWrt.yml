name: Build H68K ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device_config:
        description: 'H68K 变体配置'
        required: true
        default: 'h68k-c-d-f.config'
        type: choice
        options:
          - h68k-a-b.config
          - h68k-a-b-usb.config
          - h68k-c-d-f.config
          - h68k-c-d-f-usb.config
          - h68k-new.config

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: true
          remove-android: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools libelf-dev \
            cmake xsltproc libxml2-utils pkg-config autoconf automake libtool \
            rsync unzip zlib1g-dev \
            file wget

      - name: Update feeds & resolve conflicts
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 必须卸载同名 feed 包，否则仓库自维护的 fancontrol / luci-app-oled 会被静默覆盖
          ./scripts/feeds uninstall fancontrol luci-app-fancontrol luci-app-oled || true
          # small-package 与官方 feed / 仓库核心树有大量同名包（清单见 configs/small-feed-dedup.txt）。
          # 包扫描(find 目录顺序)不确定谁胜出，这里显式删除 small 侧同名包，
          # 保证官方 feed 版本与仓库自维护版本胜出，构建结果确定可复现。
          # small 只保留官方没有的包：luci-app-passwall2 / luci-app-ssr-plus / mihomo /
          # lucky / luci-app-lucky / luci-app-amlogic / luci-app-mosdns / shadowsocksr-libev 等。
          while read -r p; do
            case "$p" in ''|\#*) continue ;; esac
            rm -f "package/feeds/small/$p"
          done < configs/small-feed-dedup.txt
          # 例外：mosdns 反过来删官方侧。官方 packages feed 的 mosdns(5.3.3) 会安装
          # /etc/init.d/mosdns，与 small feed 的 luci-app-mosdns 自带的 init 脚本冲突
          # （opkg 报 "trying to overwrite etc/init.d/mosdns owned by mosdns"）。
          # small feed 的 mosdns(5.3.4) 只安装二进制，init 脚本与 UCI 配置由
          # luci-app-mosdns 提供，两者配套，因此让 small 版本胜出。
          rm -f package/feeds/packages/mosdns

      - name: Select device config
        run: |
          cp configs/${{ github.event.inputs.device_config }} .config
          make defconfig

      - name: Clean stale Python build state
        run: |
          # 防御性清理：清掉 Python 构建残留，避免损坏的中间态被复用。
          # GitHub 托管 runner 每次都是全新环境，此步通常为空操作；
          # 若迁移到自托管 runner 上重复构建，此步才有实际意义。
          rm -rf build_dir/target-*/Python-3.14.7
          rm -f staging_dir/target-*/stamp/.python3_installed

      - name: Download package sources
        run: |
          make -j$(nproc) download || make -j$(nproc) download

      - name: Compile firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: h68k-immortalwrt-${{ github.event.inputs.device_config }}
          path: bin/targets/rockchip/armv8/*
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: h68k-${{ github.run_number }}
          files: bin/targets/rockchip/armv8/*
          generate_release_notes: true
