name: Build H68K ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device_config:
        description: 'H68K 变体配置'
        required: true
        default: 'h68k-c-d-f.config'
        type: choice
        options:
          - h68k-a-b.config
          - h68k-a-b-usb.config
          - h68k-c-d-f.config
          - h68k-c-d-f-usb.config
          - h68k-new.config

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: true
          remove-android: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools libelf-dev \
            cmake xsltproc libxml2-utils pkg-config autoconf automake libtool \
            rsync unzip zlib1g-dev \
            file wget

      - name: Prepare host LLVM for eBPF
        run: |
          # dae/daed 在编译期要用 clang 把 eBPF 程序编成 BPF 目标文件。
          # include/bpf.mk 在 USE_LLVM_HOST 模式下拿 clang 所在目录去找
          # llc / opt / llvm-dis / llvm-strip（按 clang 主版本号，通常是无后缀名），
          # 而 Ubuntu 只提供带版本后缀的二进制，这里补上无后缀软链接。
          LLVM_DIR="$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1)"
          echo "LLVM_DIR=$LLVM_DIR"
          for t in llc opt llvm-dis llvm-strip; do
            if [ -x "$LLVM_DIR/bin/$t" ]; then
              sudo ln -sf "$LLVM_DIR/bin/$t" "/usr/local/bin/$t"
            fi
          done
          command -v clang || { echo "::error::clang 缺失"; exit 1; }
          clang --version | head -2
          for t in llc opt llvm-dis llvm-strip; do
            command -v "$t" || { echo "::error::$t 缺失（eBPF 编译需要）"; exit 1; }
          done
          # 冒烟测试：能否真的编出 bpfel 目标文件
          printf 'int dummy(void){return 0;}\n' > /tmp/bpf_probe.c
          clang -target bpfel -O2 -c /tmp/bpf_probe.c -o /tmp/bpf_probe.o
          echo "host LLVM eBPF 工具链就绪"

      - name: Update feeds & resolve conflicts
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 必须卸载同名 feed 包，否则仓库自维护的 fancontrol / luci-app-oled 会被静默覆盖
          ./scripts/feeds uninstall fancontrol luci-app-fancontrol luci-app-oled || true
          # helloworld(dev) 与官方 immortalwrt packages/luci 有 23 个同名包
          # （清单见 configs/thirdparty-dedup.txt）。同名包跨 feed 时谁胜出取决于
          # find 目录顺序，不确定；这里显式删除 helloworld 侧符号链接，
          # 让官方版本胜出，保证构建结果确定可复现。
          # helloworld 只保留官方没有的 7 个：luci-app-ssr-plus /
          # shadowsocksr-libev / shadowsocks-libev / mihomo / dns2socks-rust /
          # ipt2socks-rs / upx（upx 为反向去重例外，见下）。
          if [ -f configs/thirdparty-dedup.txt ]; then
            n=0
            while read -r p; do
              case "$p" in ''|\#*) continue ;; esac
              rm -f "package/feeds/helloworld/$p"
              n=$((n+1))
            done < configs/thirdparty-dedup.txt
            echo "已删除 helloworld 侧重名包: $n 个"
          else
            echo "::warning::configs/thirdparty-dedup.txt 不存在，跳过 helloworld 去重"
          fi
          # upx 例外（反向去重，让 helloworld 版胜出）：
          # 官方 immortalwrt 的 upx 只定义 Package/install（target 二进制），
          # 没有 Host/Install —— Run #15 实测其 host 构建跑完只写 stamp，
          # 二进制不会落到 $(STAGING_DIR_HOST)/bin/upx。
          # mihomo 声明 PKG_BUILD_DEPENDS:=golang/host upx/host，安装阶段强依赖
          # $(STAGING_DIR_HOST)/bin/upx 压缩二进制；官方版胜出时该文件不存在，
          # mihomo 必挂（Run #15 实测：Error 127,
          # staging_dir/host/bin/upx: No such file or directory）。
          # helloworld 版 upx 自带 Host/Install（硬编码装到
          # $(STAGING_DIR_HOST)/bin/upx），是 mihomo 的配套包。
          # 注意：./scripts/feeds install -a 按 feeds.conf 顺序处理，官方 packages
          # feed 先占了 upx 这个名字，helloworld 同名包会被静默跳过
          # （lookup_src 永远先找到官方侧，$installed{upx} 已置 1），
          # 因此不能等 feeds install 创建链接，必须显式删除官方侧符号链接，
          # 再手动补建 helloworld 侧符号链接（格式与 scripts/feeds 的
          # do_install_src 一致：package/feeds/<feed>/ 下按包名的相对符号链接）。
          rm -f package/feeds/packages/upx
          ln -sfn ../../../feeds/helloworld/upx package/feeds/helloworld/upx
          [ -e package/feeds/helloworld/upx/Makefile ] || { echo "::error::helloworld upx 符号链接未生效"; exit 1; }
          grep -q 'STAGING_DIR_HOST)/bin/upx' feeds/helloworld/upx/Makefile || { echo "::error::helloworld upx 缺少 Host/Install（上游可能改了写法）"; exit 1; }
          grep -q 'upx/host' feeds/helloworld/mihomo/Makefile || { echo "::error::mihomo 未声明 upx/host 依赖（上游可能改了写法）"; exit 1; }
          echo "upx 反向去重完成：官方侧符号链接已删，helloworld 版胜出"

      - name: Force host LLVM for eBPF
        run: |
          # dae/daed 需要 eBPF 编译能力。immortalwrt 的 choice BPF_TOOLCHAIN
          # 带 "prompt ... if DEVEL"，DEVEL=n 时整个 choice 不可见，kconfig 会
          # 直接取 default（Build LLVM toolchain），把 .config 里的
          # BPF_TOOLCHAIN_HOST 忽略掉 —— 结果白编 1 小时 22 分 LLVM。
          # .config 里已设 CONFIG_DEVEL=y，这里再做一道源码级保底（幂等）。
          cp toolchain/Config.in /tmp/Config.in.orig
          sed -i -E 's/^([[:space:]]*)default BPF_TOOLCHAIN_BUILD_LLVM[[:space:]]*$/\1default BPF_TOOLCHAIN_HOST/' toolchain/Config.in
          # 关掉 USE_LLVM_BUILD 的自动默认（它不跟随 choice，会被独立置 y）
          sed -i -E 's/^([[:space:]]*)default y if !DEVEL && NEED_BPF_TOOLCHAIN.*$/\1default n/' toolchain/Config.in
          if ! grep -q 'default BPF_TOOLCHAIN_HOST' toolchain/Config.in; then
            echo "::error::toolchain/Config.in 补丁未生效（上游可能改了写法）"; exit 1
          fi
          diff -u /tmp/Config.in.orig toolchain/Config.in || true

      - name: Strip DWARF debug data from kernel modules
        run: |
          # 背景：CONFIG_KERNEL_DEBUG_INFO=y 给每个 .ko 编进完整 DWARF（.debug_* 段）。
          # OpenWrt 的 rstrip.sh 对 .ko 会调 scripts/strip-kmod.sh，但它用的是
          # objcopy --strip-unneeded —— 只删符号，不删 .debug_* 段！
          # Run #12 因此 rootfs 未压缩体积达到 949MB（160MB 分区装不下）。
          # 这里给 objcopy 追加 --strip-debug（等价 -g，只删 .debug_* 段，
          # 保留 .BTF 段与模块加载所需符号；dae 读的 /sys/kernel/btf/vmlinux
          # 来自内核镜像，不受影响）。
          cp scripts/strip-kmod.sh /tmp/strip-kmod.sh.orig
          sed -i 's/ARGS="-x -G __this_module --strip-unneeded"/ARGS="-x -G __this_module --strip-unneeded --strip-debug"/' scripts/strip-kmod.sh
          if ! grep -q -- '--strip-unneeded --strip-debug' scripts/strip-kmod.sh; then
            echo "::error::strip-kmod.sh 补丁未生效（上游可能改了写法）"; exit 1
          fi
          diff -u /tmp/strip-kmod.sh.orig scripts/strip-kmod.sh || true

      - name: Select device config
        run: |
          cp configs/${{ github.event.inputs.device_config }} .config
          make defconfig

      - name: Verify BTF/XDP and dae availability
        run: |
          # 内存内核选项必须真的编进 vmlinux，且 dae 的符号必须活着，
          # 否则会白跑三四个小时，这里提前失败。
          echo "--- 内核 BTF/XDP ---"
          grep -E '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$|^CONFIG_KERNEL_XDP_SOCKETS=y$|^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set$' .config || true
          for sym in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_KERNEL_XDP_SOCKETS CONFIG_NEED_BPF_TOOLCHAIN; do
            grep -q "^$sym=y$" .config || { echo "::error::$sym 未生效，dae 无法编译"; exit 1; }
          done
          grep -q '^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set$' .config || { echo "::error::DEBUG_INFO_REDUCED 仍在开启，BTF 不可用"; exit 1; }
          echo "--- dae / daed 包符号 ---"
          for sym in CONFIG_PACKAGE_dae CONFIG_PACKAGE_daed CONFIG_PACKAGE_luci-app-dae CONFIG_PACKAGE_luci-app-daed CONFIG_PACKAGE_kmod-xdp-sockets-diag; do
            grep -q "^$sym=y$" .config || { echo "::error::$sym 未出现在 .config，依赖链未满足"; exit 1; }
          done
          echo "--- eBPF 工具链（host LLVM 必须生效，否则会白编 ~80 分钟）---"
          grep -E '^CONFIG_(DEVEL|BPF_TOOLCHAIN_|USE_LLVM_)' .config || true
          if grep -q '^CONFIG_USE_LLVM_HOST=y$' .config && ! grep -q '^CONFIG_USE_LLVM_BUILD=y$' .config; then
            echo "OK   host LLVM 生效，不会源码编译 LLVM"
          else
            echo "::warning::host LLVM 未完全生效，本次可能仍会源码编译 LLVM（约 +80 分钟）"
          fi
          echo "--- 镜像分区 ---"
          grep -E '^CONFIG_TARGET_(KERNEL|ROOTFS)_PARTSIZE=' .config
          # Run #12 的教训：.ko 里的 DWARF（CONFIG_KERNEL_DEBUG_INFO=y）把 rootfs
          # 撑到 949MB。Run #15 起 strip-kmod.sh 追加 --strip-debug 丢掉 .debug_*
          # 段（.BTF 保留，dae 不受影响），rootfs 预期回落到 350MB 左右，
          # 因此分区设为 512MB。
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=512$' .config || { echo "::error::ROOTFS_PARTSIZE 不是 512"; exit 1; }
          echo "--- DWARF 剥离补丁 ---"
          grep -q -- '--strip-unneeded --strip-debug' scripts/strip-kmod.sh || { echo "::error::strip-kmod.sh 未追加 --strip-debug，.ko 会带 DWARF 撑爆 rootfs"; exit 1; }
          grep -E '^CONFIG_(USE_STRIP|USE_SSTRIP)' .config || true
          echo "OK   strip 配置就绪"
          echo "--- 第三方 feed 应用 ---"
          for sym in CONFIG_PACKAGE_luci-app-passwall2 CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All \
                     CONFIG_PACKAGE_luci-app-ssr-plus CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Mihomo \
                     CONFIG_PACKAGE_shadowsocksr-libev-ssr-local CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir \
                     CONFIG_PACKAGE_shadowsocksr-libev-ssr-server CONFIG_PACKAGE_mihomo \
                     CONFIG_PACKAGE_lucky CONFIG_PACKAGE_luci-app-lucky \
                     CONFIG_PACKAGE_luci-app-amlogic; do
            grep -q "^$sym=y$" .config || { echo "::error::$sym 未生效（feed 或依赖链有问题）"; exit 1; }
          done
          echo "OK   第三方应用符号全部在位"
          echo "--- helloworld 侧重名包已删除（官方版本应胜出）---"
          for p in mosdns hysteria xray-core v2ray-core simple-obfs shadowsocks-rust; do
            if [ -e "package/feeds/helloworld/$p" ]; then
              echo "::error::package/feeds/helloworld/$p 仍然存在，去重未生效"; exit 1
            fi
          done
          echo "OK   helloworld 去重生效"
          echo "--- upx provider（mihomo 的 host 构建依赖，Run #15 教训）---"
          # 官方 upx 无 Host/Install，host 二进制不会安装；必须让 helloworld 版胜出
          if [ -e package/feeds/packages/upx ]; then
            echo "::error::package/feeds/packages/upx 仍存在，upx 反向去重未生效，mihomo 会因缺少 staging_dir/host/bin/upx 而失败"; exit 1
          fi
          if [ ! -e package/feeds/helloworld/upx ]; then
            echo "::error::package/feeds/helloworld/upx 不存在，upx 反向去重失败"; exit 1
          fi
          grep -q 'STAGING_DIR_HOST)/bin/upx' feeds/helloworld/upx/Makefile || { echo "::error::helloworld upx 缺少 Host/Install（上游可能改了写法）"; exit 1; }
          grep -q 'upx/host' feeds/helloworld/mihomo/Makefile || { echo "::error::mihomo 未声明 upx/host 依赖（上游可能改了写法）"; exit 1; }
          echo "OK   upx -> helloworld（Host/Install 就绪）"
          echo "--- 其余关键包 ---"
          for sym in CONFIG_PACKAGE_luci-app-passwall CONFIG_PACKAGE_luci-app-openclash \
                     CONFIG_PACKAGE_luci-app-openlist CONFIG_PACKAGE_luci-app-dockerman \
                     CONFIG_PACKAGE_luci-app-filebrowser CONFIG_PACKAGE_luci-app-rclone \
                     CONFIG_PACKAGE_luci-app-openvpn-server CONFIG_PACKAGE_luci-app-ddns \
                     CONFIG_PACKAGE_luci-app-attendedsysupgrade CONFIG_PACKAGE_mosdns; do
            if grep -q "^$sym=y$" .config; then echo "OK   $sym"; else echo "MISS $sym"; fi
          done
          echo "自检通过"

      - name: Clean stale Python build state
        run: |
          # 防御性清理：清掉 Python 构建残留，避免损坏的中间态被复用。
          # GitHub 托管 runner 每次都是全新环境，此步通常为空操作；
          # 若迁移到自托管 runner 上重复构建，此步才有实际意义。
          rm -rf build_dir/target-*/Python-3.14.7
          rm -f staging_dir/target-*/stamp/.python3_installed

      - name: Download package sources
        run: |
          make -j$(nproc) download || make -j$(nproc) download

      - name: Compile firmware
        # 首次失败后并行重试（V=s 保留报错细节）。不再用 -j1 串行重试：
        # 一旦在中途失败，串行重跑要几个小时，直接撞 360 分钟上限。
        run: make -j$(nproc) || (echo "===== 并行构建失败，并行重试（V=s）====="; make -j$(nproc) V=s)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: h68k-immortalwrt-${{ github.event.inputs.device_config }}
          path: bin/targets/rockchip/armv8/*
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: h68k-${{ github.run_number }}
          files: bin/targets/rockchip/armv8/*
          generate_release_notes: true
