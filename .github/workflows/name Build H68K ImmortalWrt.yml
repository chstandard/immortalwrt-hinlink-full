name: Build H68K ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device_config:
        description: 'H68K 变体配置'
        required: true
        default: 'h68k-c-d-f.config'
        type: choice
        options:
          - h68k-a-b.config
          - h68k-a-b-usb.config
          - h68k-c-d-f.config
          - h68k-c-d-f-usb.config
          - h68k-new.config

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: true
          remove-android: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools libelf-dev \
            cmake xsltproc libxml2-utils pkg-config autoconf automake libtool \
            rsync unzip zlib1g-dev \
            file wget

      - name: Update feeds & resolve conflicts
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 必须卸载同名 feed 包，否则仓库自维护的 fancontrol / luci-app-oled 会被静默覆盖
          ./scripts/feeds uninstall fancontrol luci-app-fancontrol luci-app-oled || true
          # small-package 与官方 feed 有大量同名包。包扫描(find 目录顺序)不确定谁胜出，
          # 这里显式删除 small 侧同名包，保证官方 feed 版本胜出，构建结果确定可复现。
          # small 只保留官方没有的包：luci-app-passwall2 / luci-app-ssr-plus / mihomo /
          # lucky / luci-app-lucky / luci-app-amlogic / luci-app-mosdns / shadowsocksr-libev 等。
          SMALL_DUP="\
  adguardhome alac amule aria2 ariang autocore base-files brook btop cdnspeedtest chinadns-ng
  coremark cpulimit cups dae daed ddns-go ddns-scripts ddns-scripts_dnspod dns2socks dns2tcp
  dnsforwarder dnsmasq dnsproxy docker dockerd filebrowser firewall firewall4 frp fullconenat
  fullconenat-nft geoview gmediarender gn gost haproxy hysteria ipt2socks jpcre2 libcron
  libcryptopp libdouble-conversion libnftnl libtorrent-rasterbar lua-maxminddb lua-neturl
  luci-app-3ginfo-lite luci-app-adguardhome luci-app-argon-config luci-app-arpbind
  luci-app-autoreboot luci-app-cifs-mount luci-app-dae luci-app-daed luci-app-ddns-go
  luci-app-diskman luci-app-dockerman luci-app-eqos luci-app-filebrowser luci-app-filebrowser-go
  luci-app-frpc luci-app-frps luci-app-gost luci-app-homeproxy luci-app-msd_lite luci-app-natmap
  luci-app-netdata luci-app-nfs luci-app-nps luci-app-oled luci-app-openclash luci-app-openlist
  luci-app-openvpn-server luci-app-passwall luci-app-pppoe-relay luci-app-pppoe-server
  luci-app-qbittorrent luci-app-ramfree luci-app-smartdns luci-app-snmpd luci-app-softethervpn
  luci-app-syncdial luci-app-syncthing luci-app-sysuh3c luci-app-timewol luci-app-transmission
  luci-app-unblockneteasemusic luci-app-usb-printer luci-app-v2raya luci-app-vlmcsd luci-app-vsftpd
  luci-app-wechatpush luci-app-xlnetacc luci-app-zerotier luci-proto-minieap luci-theme-argon mhz
  microsocks mosdns msd_lite msmtp mwan3 naiveproxy natmap netatalk netdata nftables nginx ngrokc
  nps open-app-filter opkg oscam parted ppp qbittorrent qt6base qt6tools quickjspp rapidjson
  redsocks2 rp-pppoe scutclient shadow-tls shadowsocks-rust simple-obfs sing-box smartdns src
  sub-web subconverter sysuh3c tailscale tcping toml11 tools transmission
  transmission-web-control trojan tuic-client udp2raw upx uwsgi v2ray-core v2ray-geodata
  v2ray-plugin v2raya vlmcsd vsftpd watchcat wireless-regdb wxbase xray-core xray-plugin"
          for p in $SMALL_DUP; do rm -f "package/feeds/small/$p"; done

      - name: Select device config
        run: |
          cp configs/${{ github.event.inputs.device_config }} .config
          make defconfig

      - name: Clean stale Python build state
        run: |
          # 防御性清理：清掉 Python 构建残留，避免损坏的中间态被复用。
          # GitHub 托管 runner 每次都是全新环境，此步通常为空操作；
          # 若迁移到自托管 runner 上重复构建，此步才有实际意义。
          rm -rf build_dir/target-*/Python-3.14.7
          rm -f staging_dir/target-*/stamp/.python3_installed

      - name: Download package sources
        run: |
          make -j$(nproc) download || make -j$(nproc) download

      - name: Compile firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: h68k-immortalwrt-${{ github.event.inputs.device_config }}
          path: bin/targets/rockchip/armv8/*
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: h68k-${{ github.run_number }}
          files: bin/targets/rockchip/armv8/*
          generate_release_notes: true
