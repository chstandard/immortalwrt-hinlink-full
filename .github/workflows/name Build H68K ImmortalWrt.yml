name: Build H68K ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device_config:
        description: 'H68K 变体配置'
        required: true
        default: 'h68k-c-d-f.config'
        type: choice
        options:
          - h68k-a-b.config
          - h68k-a-b-usb.config
          - h68k-c-d-f.config
          - h68k-c-d-f-usb.config
          - h68k-new.config

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          remove-dotnet: true
          remove-android: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools libelf-dev \
            cmake xsltproc libxml2-utils pkg-config autoconf automake libtool \
            rsync unzip zlib1g-dev \
            file wget

      - name: Prepare host LLVM for eBPF
        run: |
          # dae/daed 在编译期要用 clang 把 eBPF 程序编成 BPF 目标文件。
          # include/bpf.mk 在 USE_LLVM_HOST 模式下拿 clang 所在目录去找
          # llc / opt / llvm-dis / llvm-strip（按 clang 主版本号，通常是无后缀名），
          # 而 Ubuntu 只提供带版本后缀的二进制，这里补上无后缀软链接。
          LLVM_DIR="$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1)"
          echo "LLVM_DIR=$LLVM_DIR"
          for t in llc opt llvm-dis llvm-strip; do
            if [ -x "$LLVM_DIR/bin/$t" ]; then
              sudo ln -sf "$LLVM_DIR/bin/$t" "/usr/local/bin/$t"
            fi
          done
          command -v clang || { echo "::error::clang 缺失"; exit 1; }
          clang --version | head -2
          for t in llc opt llvm-dis llvm-strip; do
            command -v "$t" || { echo "::error::$t 缺失（eBPF 编译需要）"; exit 1; }
          done
          # 冒烟测试：能否真的编出 bpfel 目标文件
          printf 'int dummy(void){return 0;}\n' > /tmp/bpf_probe.c
          clang -target bpfel -O2 -c /tmp/bpf_probe.c -o /tmp/bpf_probe.o
          echo "host LLVM eBPF 工具链就绪"

      - name: Update feeds & resolve conflicts
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 必须卸载同名 feed 包，否则仓库自维护的 fancontrol / luci-app-oled 会被静默覆盖
          ./scripts/feeds uninstall fancontrol luci-app-fancontrol luci-app-oled || true

      - name: Select device config
        run: |
          cp configs/${{ github.event.inputs.device_config }} .config
          make defconfig

      - name: Verify BTF/XDP and dae availability
        run: |
          # 内存内核选项必须真的编进 vmlinux，且 dae 的符号必须活着，
          # 否则会白跑三四个小时，这里提前失败。
          echo "--- 内核 BTF/XDP ---"
          grep -E '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$|^CONFIG_KERNEL_XDP_SOCKETS=y$|^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set$' .config || true
          for sym in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_KERNEL_XDP_SOCKETS CONFIG_NEED_BPF_TOOLCHAIN; do
            grep -q "^$sym=y$" .config || { echo "::error::$sym 未生效，dae 无法编译"; exit 1; }
          done
          grep -q '^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set$' .config || { echo "::error::DEBUG_INFO_REDUCED 仍在开启，BTF 不可用"; exit 1; }
          echo "--- dae / daed 包符号 ---"
          for sym in CONFIG_PACKAGE_dae CONFIG_PACKAGE_daed CONFIG_PACKAGE_luci-app-dae CONFIG_PACKAGE_luci-app-daed CONFIG_PACKAGE_kmod-xdp-sockets-diag; do
            grep -q "^$sym=y$" .config || { echo "::error::$sym 未出现在 .config，依赖链未满足"; exit 1; }
          done
          echo "--- 其余关键包 ---"
          for sym in CONFIG_PACKAGE_luci-app-passwall CONFIG_PACKAGE_luci-app-openclash \
                     CONFIG_PACKAGE_luci-app-openlist CONFIG_PACKAGE_luci-app-dockerman \
                     CONFIG_PACKAGE_luci-app-filebrowser CONFIG_PACKAGE_luci-app-rclone \
                     CONFIG_PACKAGE_luci-app-openvpn-server CONFIG_PACKAGE_luci-app-ddns \
                     CONFIG_PACKAGE_luci-app-attendedsysupgrade CONFIG_PACKAGE_mosdns; do
            if grep -q "^$sym=y$" .config; then echo "OK   $sym"; else echo "MISS $sym"; fi
          done
          echo "自检通过"

      - name: Clean stale Python build state
        run: |
          # 防御性清理：清掉 Python 构建残留，避免损坏的中间态被复用。
          # GitHub 托管 runner 每次都是全新环境，此步通常为空操作；
          # 若迁移到自托管 runner 上重复构建，此步才有实际意义。
          rm -rf build_dir/target-*/Python-3.14.7
          rm -f staging_dir/target-*/stamp/.python3_installed

      - name: Download package sources
        run: |
          make -j$(nproc) download || make -j$(nproc) download

      - name: Compile firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: h68k-immortalwrt-${{ github.event.inputs.device_config }}
          path: bin/targets/rockchip/armv8/*
          if-no-files-found: error

      - name: Publish to Releases
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: h68k-${{ github.run_number }}
          files: bin/targets/rockchip/armv8/*
          generate_release_notes: true
